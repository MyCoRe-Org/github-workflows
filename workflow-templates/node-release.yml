# npm trusted publishing checks the name of this file, configure it on npmjs.com
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # sets the version and pushes the tag, needs the GitHub App and the environment release
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true

permissions: {}

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: MyCoRe-Org/github-workflows/.github/workflows/node-release-tag.yml@v1
    with:
      version: ${{ inputs.version }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}

  publish:
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    uses: MyCoRe-Org/github-workflows/.github/workflows/node-release.yml@v1
    with:
      node-version: '24'
    secrets:
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}

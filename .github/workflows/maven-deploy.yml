name: Maven Snapshot Deploy

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: true
      skip-tests:
        type: boolean
        default: false
      build-args:
        type: string
        default: ''
      # empty for the default in the env of build
      central-publishing-version:
        type: string
        default: ''
      maven-opts:
        type: string
        default: ''
      setup-browser:
        type: boolean
        default: false
      project-setup:
        type: boolean
        default: false
      docker-images:
        type: string
        default: ''
      docker-date-tag:
        type: boolean
        default: false
      version-qualifier:
        type: string
        default: ''
      environment:
        type: string
        default: ''
    secrets:
      MAVEN_USERNAME:
        required: true
      MAVEN_PASSWORD:
        required: true
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

# Code of the project, the tests, Maven plugins and npm packages included, only runs in build, which gets no secret.
# deploy and images run no code of the project and only upload what belongs to it.
jobs:
  # builds and tests the snapshot and stages it in a directory instead of uploading it
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # for every Maven run, some projects pass it on to their integration tests
      MAVEN_OPTS: ${{ inputs.maven-opts }}
      # pinned, Dependabot does not see it. An empty input, as maven-deploy-pr passes by default, stands for it
      CENTRAL_PUBLISHING_VERSION: ${{ inputs.central-publishing-version || '0.12.0' }}
    outputs:
      deploy-plugin-version: ${{ steps.build.outputs.deploy-plugin-version }}
      has-images: ${{ steps.images.outputs.has-images }}
    steps:
      # the build needs skipUpload, which the central-publishing-maven-plugin has from 0.12.0 on
      - name: Check central-publishing-version
        run: |
          if [[ ! "$CENTRAL_PUBLISHING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || [ "$(printf '%s\n' 0.12.0 "$CENTRAL_PUBLISHING_VERSION" | sort -V | head -n 1)" != 0.12.0 ]; then
            echo "::error::central-publishing-version '${CENTRAL_PUBLISHING_VERSION}' is no version 0.12.0 or newer, older ones have no skipUpload"
            exit 1
          fi
          # deploy reads the staging directory as 0.12.0 writes it
          if [ "$CENTRAL_PUBLISHING_VERSION" != 0.12.0 ]; then
            echo "::warning::the upload of the snapshots knows the staging directory of central-publishing-maven-plugin 0.12.0, ${CENTRAL_PUBLISHING_VERSION} may write it differently and fail in deploy"
          fi

      - uses: $/.github/actions/maven-setup
        with:
          java-version: ${{ inputs.java-version }}
          setup-browser: ${{ inputs.setup-browser }}
          project-setup: ${{ inputs.project-setup }}

      # 2026.06.1-SNAPSHOT with the qualifier test becomes 2026.06.1-test-SNAPSHOT
      - name: Add the version qualifier
        if: inputs.version-qualifier != ''
        env:
          QUALIFIER: ${{ inputs.version-qualifier }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          set -euo pipefail
          if [[ ! "$QUALIFIER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::version-qualifier '${QUALIFIER}' may only contain letters, digits, '.', '_' and '-'"
            exit 1
          fi
          # pinned, mycore-parent does not manage it and Dependabot does not see it.
          # Maven writes its errors to stdout, they are printed if it fails
          VERSION="$(mvn --batch-mode --no-transfer-progress -q -N \
            org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -DforceStdout)" \
            || { echo "$VERSION"; exit 1; }
          case "$VERSION" in
            *-SNAPSHOT) ;;
            *)
              echo "::error::${VERSION} is not a snapshot, only snapshots get a qualifier"
              exit 1
              ;;
          esac
          QUALIFIED="${VERSION%-SNAPSHOT}-${QUALIFIER}-SNAPSHOT"
          # with the arguments of the build, whose profiles may add modules. Split at spaces and line breaks, so a
          # YAML block keeps all its arguments
          read -r -d '' -a ARGS <<< "$BUILD_ARGS" || true
          mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="$QUALIFIED" -DgenerateBackupPoms=false \
            "${ARGS[@]}"
          echo "Deploying ${QUALIFIED}"

      # deploy-to-central of mycore-parent stages the snapshots, -DskipUpload=true keeps them in deferredDirectory
      # instead of uploading them. -D sets the plugin to central-publishing-version, the parents bring versions without
      # skipUpload, see maven-release.yml. Like every deploy with the plugin, it stages modules with maven.deploy.skip
      # as well (e.g. mir-it up to 2025.06.x), only skipPublishing leaves a module out
      - name: Build the snapshot
        id: build
        env:
          SKIP_TESTS_FLAG: ${{ inputs.skip-tests && '-DskipTests' || '' }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          set -euo pipefail
          # pinned, mycore-parent does not manage it and Dependabot does not see it.
          # Maven writes its errors to stdout, they are printed if it fails
          VERSION="$(mvn --batch-mode --no-transfer-progress -q -N \
            org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -DforceStdout)" \
            || { echo "$VERSION"; exit 1; }
          # for a release the plugin would build a bundle for Central, which nothing uploads
          case "$VERSION" in
            *-SNAPSHOT) ;;
            *)
              echo "::error::${VERSION} is not a snapshot, only snapshots are deployed"
              exit 1
              ;;
          esac
          # deploy uploads with the maven-deploy-plugin the parent manages and checks the version again,
          # this only fails before the build
          DEPLOY_PLUGIN="$(mvn --batch-mode --no-transfer-progress -q -N \
            org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=maven-deploy-plugin.version \
            -DforceStdout || true)"
          if [[ ! "$DEPLOY_PLUGIN" =~ ^3\.[1-9][0-9]*\.[0-9]+$ ]]; then
            echo "::error::the parent manages no maven-deploy-plugin 3.1 or newer but '${DEPLOY_PLUGIN}', mycore-parent 57 or newer is required"
            exit 1
          fi
          echo "deploy-plugin-version=${DEPLOY_PLUGIN}" >> "$GITHUB_OUTPUT"
          # split at spaces and line breaks, so a YAML block keeps all its arguments
          read -r -d '' -a ARGS <<< "$BUILD_ARGS" || true
          STAGING="${RUNNER_TEMP}/snapshot-staging"
          # the last -D wins, so build-args cannot change the checked version, turn the upload on or move the snapshots
          mvn --batch-mode --no-transfer-progress deploy ${SKIP_TESTS_FLAG:+"$SKIP_TESTS_FLAG"} "${ARGS[@]}" \
            "-Dcentral-publishing-maven-plugin.version=${CENTRAL_PUBLISHING_VERSION}" -DskipUpload=true \
            "-DdeferredDirectory=${STAGING}"
          # the hidden .index of the plugin is no snapshot, upload-artifact leaves it out
          if [ -z "$(find "$STAGING" -type f ! -name '.*' -print -quit 2> /dev/null)" ]; then
            echo "::error::the build staged nothing in ${STAGING}, deploy-to-central of mycore-parent 57 or newer stages the snapshots"
            exit 1
          fi

      # built here without credentials, the job images only pushes them
      - name: Build the Docker images
        id: images
        uses: $/.github/actions/docker-build
        with:
          images: ${{ inputs.docker-images }}
          archive: ${{ runner.temp }}/snapshot-images/images.tar

      # overwrite, as a re-run of the whole workflow uploads them again
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-staging
          path: ${{ runner.temp }}/snapshot-staging
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - if: steps.images.outputs.has-images == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-images
          path: ${{ runner.temp }}/snapshot-images
          retention-days: 1
          overwrite: true

  # uploads the snapshots of build that belong to the project
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # empty runs without environment, an environment restricts the deploy to its deployment branches
    # and provides its secrets
    environment: ${{ inputs.environment }}
    # Maven runs here with the Central token, a poisoned cache entry could replace the maven-deploy-plugin
    cache-mode: none
    permissions:
      contents: read
    steps:
      # its poms name the components that may be uploaded, nothing of the checkout runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          server-id: 'central'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-staging
          path: ${{ runner.temp }}/snapshot-staging

      - uses: $/.github/actions/snapshot-upload
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        with:
          staging: ${{ runner.temp }}/snapshot-staging
          version-qualifier: ${{ inputs.version-qualifier }}
          deploy-plugin-version: ${{ needs.build.outputs.deploy-plugin-version }}

  # pushes the images of build once the snapshots are uploaded
  images:
    needs: [build, deploy]
    if: needs.build.outputs.has-images == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    cache-mode: none
    permissions: {}
    steps:
      - name: Determine the Docker tags
        id: docker-tags
        env:
          DATE_TAG: ${{ inputs.docker-date-tag }}
        run: |
          # docker tags must not start with '.' or '-' and are limited to 128 characters, 11 are left for the date
          REF="$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._\n-' '-' | sed 's/^[.-]*//' | cut -c1-117)"
          TAGS="$REF"
          if [ "$DATE_TAG" = "true" ]; then
            TAGS="$TAGS ${REF}-$(date +'%Y-%m-%d')"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-images
          path: ${{ runner.temp }}/snapshot-images

      - uses: $/.github/actions/docker-push
        with:
          images: ${{ inputs.docker-images }}
          tags: ${{ steps.docker-tags.outputs.tags }}
          archive: ${{ runner.temp }}/snapshot-images/images.tar
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

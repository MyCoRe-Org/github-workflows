name: Node Setup
description: Checkout, set up Node.js with Corepack and install dependencies with Yarn.

inputs:
  node-version:
    description: Node.js version to use (e.g. '20', '22')
    required: true
  registry-url:
    description: Registry to configure for publishing (optional)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Enable Corepack
      shell: bash
      run: |
        # Node.js 25 and newer no longer ship Corepack
        if ! command -v corepack > /dev/null; then
          npm install --global corepack@latest
        fi
        corepack enable

    - name: Cache node_modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: node_modules
        key: node-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('**/yarn.lock') }}

    - name: Install dependencies
      shell: bash
      run: |
        if [[ "$(yarn --version)" == 1.* ]]; then
          yarn install --frozen-lockfile
        else
          yarn install --immutable
        fi
